{% extends "base.html" %}
{% block title %}Tạo mục tiêu · Smart Expense{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:480px;" data-aos="fade-up">
  <h4 class="fw-bold mb-4"><i class="fa-solid fa-bullseye me-2"></i>Tạo mục tiêu tiết kiệm</h4>
  <form method="post" class="glass p-4">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label small text-muted-soft">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <div class="d-flex gap-2 mt-3">
      <a href="{% url 'goals:goal_list' %}" class="btn btn-outline-light flex-fill rounded-3">Hủy</a>
      <button type="submit" class="btn btn-brand flex-fill rounded-3">Tạo mục tiêu</button>
    </div>
  </form>
</div>
{% endblock %}
