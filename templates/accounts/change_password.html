{% extends "base.html" %}
{% block title %}Đổi mật khẩu · Smart Expense{% endblock %}
{% block content %}
<div class="glass p-4" style="max-width:480px;" data-aos="fade-up">
  <h5 class="fw-bold mb-3"><i class="fa-solid fa-key me-2"></i>Đổi mật khẩu</h5>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label small text-muted-soft">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-brand rounded-3 px-4">Cập nhật mật khẩu</button>
  </form>
</div>
{% endblock %}
