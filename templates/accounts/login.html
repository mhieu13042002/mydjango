{% extends "accounts/_auth_base.html" %}
{% block auth_form %}
<form method="post">
  {% csrf_token %}
  {% if form.errors %}
  <div class="alert alert-danger rounded-3 small py-2">Tên đăng nhập hoặc mật khẩu không đúng.</div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label small text-muted-soft">Tên đăng nhập</label>
    <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label small text-muted-soft">Mật khẩu</label>
    <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
  </div>
  <div class="d-flex justify-content-end mb-3">
    <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none">Quên mật khẩu?</a>
  </div>
  <button type="submit" class="btn btn-brand w-100 py-2 rounded-3 fw-semibold">Đăng nhập</button>
  <div class="text-center small text-muted-soft mt-3">
    Chưa có tài khoản? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
  </div>
</form>
{% endblock %}
