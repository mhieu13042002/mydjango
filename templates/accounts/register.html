{% extends "accounts/_auth_base.html" %}
{% block auth_form %}
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label small text-muted-soft">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-brand w-100 py-2 rounded-3 fw-semibold mt-2">Tạo tài khoản</button>
  <div class="text-center small text-muted-soft mt-3">
    Đã có tài khoản? <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold">Đăng nhập</a>
  </div>
</form>
{% endblock %}
