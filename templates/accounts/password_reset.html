{% extends "accounts/_auth_base.html" %}
{% block auth_form %}
<p class="text-muted-soft small mb-3">Nhập email đã đăng ký, hệ thống sẽ gửi link đặt lại mật khẩu cho bạn.</p>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label small text-muted-soft">Email</label>
    <input type="email" name="email" class="form-control" placeholder="email@example.com" required autofocus>
  </div>
  <button type="submit" class="btn btn-brand w-100 py-2 rounded-3 fw-semibold">Gửi link đặt lại mật khẩu</button>
  <div class="text-center small text-muted-soft mt-3">
    <a href="{% url 'accounts:login' %}" class="text-decoration-none">← Quay lại đăng nhập</a>
  </div>
</form>
{% endblock %}
