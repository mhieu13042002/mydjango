<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<defs>

<!-- Sổ chi (ledger book) — dùng cho logo -->
<symbol id="sc-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v13H7.5A2.5 2.5 0 0 1 5 17.5V4.5Z"/>
  <path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19"/>
  <path d="M9 8.5h6M9 11.5h4"/>
</symbol>

<!-- Dashboard: đồng xu xếp -->
<symbol id="sc-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="12" cy="6" rx="7" ry="2.6"/>
  <path d="M5 6v5c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/>
  <path d="M5 11v5c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-5"/>
</symbol>

<!-- Thêm chi tiêu: biên lai + dấu cộng -->
<symbol id="sc-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 3.5h9l3 3v14l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3v-17Z"/>
  <path d="M12 9v6M9 12h6"/>
</symbol>

<!-- Lịch sử: cuộn giấy -->
<symbol id="sc-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 5.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
  <path d="M8 9h8M8 12.5h8M8 16h5"/>
  <path d="M4 8.2c1.6-.5 1.6 1 0 .5"/>
</symbol>

<!-- Ngân sách: đồng hồ đo (gauge) -->
<symbol id="sc-budget" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 15a8 8 0 1 1 16 0"/>
  <path d="M12 15 16 9.5"/>
  <path d="M4 15h16"/>
</symbol>

<!-- Mục tiêu tiết kiệm: mũi tên trúng đích -->
<symbol id="sc-goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8"/>
  <circle cx="12" cy="12" r="4"/>
  <path d="M19 5l-4.2 4.2M19 5v3.2M19 5h-3.2"/>
</symbol>

<!-- Thông báo: chuông với dây */ -->
<symbol id="sc-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.2 1.5 5.2H4.5S6 14 6 10Z"/>
  <path d="M10 18.5a2 2 0 0 0 4 0"/>
</symbol>

<!-- Chụp ảnh AI: khung ngắm + tia -->
<symbol id="sc-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/>
  <circle cx="12" cy="12" r="3.4"/>
</symbol>

<!-- Danh mục: lớp xếp -->
<symbol id="sc-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3.5 20 8l-8 4.5L4 8Z"/>
  <path d="M4 12l8 4.5L20 12M4 16l8 4.5L20 16"/>
</symbol>

<!-- Xu hướng tăng -->
<symbol id="sc-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 16 10 10l4 4 6-7"/><path d="M15 7h5v5"/>
</symbol>

<!-- Xu hướng giảm -->
<symbol id="sc-trend-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 8 10 14l4-4 6 7"/><path d="M15 17h5v-5"/>
</symbol>

<!-- Ví -->
<symbol id="sc-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h11a2.5 2.5 0 0 1 2.5 2.5V9H6a2.5 2.5 0 0 1 0-5"/>
  <path d="M3.5 9v9A2.5 2.5 0 0 0 6 20.5h12A1.5 1.5 0 0 0 19.5 19v-8A1.5 1.5 0 0 0 18 9.5H6"/>
  <circle cx="16" cy="14" r="1.2" fill="currentColor" stroke="none"/>
</symbol>

<!-- Cài đặt / hồ sơ -->
<symbol id="sc-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="8.2" r="3.4"/>
  <path d="M5 19.5c1-3.4 3.9-5.2 7-5.2s6 1.8 7 5.2"/>
</symbol>

<!-- Tìm kiếm -->
<symbol id="sc-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.3-4.3"/>
</symbol>

<!-- Đăng xuất -->
<symbol id="sc-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 4.5H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8"/>
  <path d="M10 12h10.5M17.5 8.5 21 12l-3.5 3.5"/>
</symbol>

<!-- Chế độ tối -->
<symbol id="sc-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a7 7 0 0 0 10.2 10.2Z"/>
</symbol>

<!-- Chế độ sáng -->
<symbol id="sc-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="4.2"/>
  <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6"/>
</symbol>

</defs>
</svg>
